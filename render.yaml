services:
  - type: web
    name: career-match-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: career-match-db
          property: connectionString
      - key: SECRET_KEY
        value: uEC6dodPtE7F9Cu0SLn4CWhKlLRDcsb60DonlhAaUGo
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: '["https://*.onrender.com"]'
      - key: APP_NAME
        value: Career Match API
      - key: APP_VERSION
        value: "1.0.0"

  - type: postgres
    name: career-match-db
    plan: free
    databaseName: career_match
    ipAllowList: []
